<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-image:url('banner.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    font-family:Arial, sans-serif;
    padding:20px;
}

.container{
    text-align:center;
    background:rgba(0,0,0,0.5);
    padding:30px;
    border-radius:15px;
    width:100%;
    max-width:500px;
}

h1{
    color:white;
    font-size:clamp(1.5rem, 5vw, 3rem);
    margin-bottom:20px;
    line-height:1.3;
}

p{
    color:white;
    font-size:clamp(0.9rem, 3vw, 1.2rem);
    margin-bottom:25px;
}

button{
    padding:12px 30px;
    font-size:1rem;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#007BFF;
    color:white;
    transition:0.3s;
    width:100%;
    max-width:250px;
}

button:hover{
    background:#0056b3;
}

/* Mobile devices */
@media (max-width: 480px){

    .container{
        padding:20px;
    }

    h1{
        margin-bottom:15px;
    }

    p{
        margin-bottom:20px;
    }

    button{
        padding:12px;
        font-size:0.95rem;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>Family Show</h1>

    <p>Click the button below to continue.</p>

    <button onclick="window.location.href='https://52894e0e06dadd.lhr.life'">
        Enter
    </button>
</div>

</body>
</html>
